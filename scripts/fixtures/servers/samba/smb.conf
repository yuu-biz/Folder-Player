[global]
   workgroup = FIXTURE
   server string = FolderPlayer SMB fixture
   server role = standalone server
   security = user
   map to guest = Bad User
   server min protocol = SMB2_02
   server max protocol = SMB3_11
   server signing = auto
   smb encrypt = desired
   unix charset = UTF-8
   log level = 1
   load printers = no
   disable spoolss = yes

# Fixture tree; alice may write below /rw, bob is read-only.
[music]
   path = /srv/music
   valid users = alice bob
   read only = yes
   write list = alice

# Same share name and paths for both users, different content per user (credential separation test).
[home]
   path = /srv/home/%U
   valid users = alice bob
   read only = yes

# Only alice may connect.
[alice]
   path = /srv/alice
   valid users = alice
   read only = yes

[public]
   path = /srv/public
   guest ok = yes
   read only = yes
