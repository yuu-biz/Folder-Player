DavLockDB /usr/local/apache2/var/DavLock
Alias /dav /srv/dav
<Directory /srv/dav>
    Dav On
    Options +Indexes
    AuthType Basic
    AuthName "fixture"
    AuthUserFile /usr/local/apache2/conf/dav.htpasswd
    # Both users read; only alice writes.
    <Limit GET HEAD OPTIONS PROPFIND>
        Require valid-user
    </Limit>
    <LimitExcept GET HEAD OPTIONS PROPFIND>
        Require user alice
    </LimitExcept>
</Directory>
