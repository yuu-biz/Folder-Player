name: Release APK

# Push a tag like v0.5.1 to build the APK and publish it as a GitHub release.
# "Run workflow" (workflow_dispatch) builds the same APK as a workflow artifact without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 28.2.13676358
  # gradle/gradle-daemon-jvm.properties requires a JetBrains JDK 21 (SDK build).
  JBR_TARBALL: jbrsdk-21.0.11-linux-x64-b1163.116.tar.gz
  JBR_SHA256: 097bf328b5bf5a236c095b8c8e5204c0eda91e5baa06b37383a7754b10671d8b

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: JetBrains JDK 21
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jbr.tar.gz" "https://cache-redirector.jetbrains.com/intellij-jbr/$JBR_TARBALL"
          echo "$JBR_SHA256  $RUNNER_TEMP/jbr.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/jbr"
          tar -xzf "$RUNNER_TEMP/jbr.tar.gz" -C "$RUNNER_TEMP/jbr" --strip-components=1
          echo "FP_JBR_HOME=$RUNNER_TEMP/jbr" >> "$GITHUB_ENV"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: |
            native/out
            native/src-cache
          key: ffmpeg-${{ hashFiles('native/build-ffmpeg.sh') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: FFmpeg (LGPL, from the pinned source tarball)
        run: bash native/build-ffmpeg.sh

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build
        env:
          FP_KEYSTORE_BASE64: ${{ secrets.FP_KEYSTORE_BASE64 }}
          FP_KEYSTORE_PASSWORD: ${{ secrets.FP_KEYSTORE_PASSWORD }}
          FP_KEY_ALIAS: ${{ secrets.FP_KEY_ALIAS }}
          FP_KEY_PASSWORD: ${{ secrets.FP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          PROPS="-PfpVersionName=$VERSION -PfpVersionCode=$VERSION_CODE"
          if [ -n "$FP_KEYSTORE_BASE64" ]; then
            echo "$FP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/release.jks" "$FP_KEYSTORE_PASSWORD" "$FP_KEY_ALIAS" "$FP_KEY_PASSWORD" > keystore.properties
            bash scripts/wsl-gradle.sh --no-daemon $PROPS assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "FolderPlayerFork-$VERSION.apk"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: publishing a debug-signed APK"
            bash scripts/wsl-gradle.sh --no-daemon $PROPS assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "FolderPlayerFork-$VERSION-debug.apk"
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"
          sha256sum FolderPlayerFork-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 16 KB page check
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 4 FolderPlayerFork-*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderPlayerFork-${{ env.VERSION }}
          path: |
            FolderPlayerFork-*.apk
            SHA256SUMS.txt

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNING" = "debug" ]; then
            SIGNING_NOTE="This build is signed with a temporary debug key (no release key configured), so it cannot be installed over a build signed with a different key."
          else
            SIGNING_NOTE="Signed with the fork's release key."
          fi
          sed -e "s|{VERSION_TAG}|$GITHUB_REF_NAME|g" -e "s|{VERSION}|$VERSION|g" -e "s|{SIGNING_NOTE}|$SIGNING_NOTE|" \
            -e "s|{REPO}|$GITHUB_SERVER_URL/$GITHUB_REPOSITORY|g" \
            .github/release-notes.md > notes.md
          { echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> notes.md
          cp native/src-cache/ffmpeg-7.1.5.tar.xz .
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" FolderPlayerFork-*.apk SHA256SUMS.txt ffmpeg-7.1.5.tar.xz --clobber
          else
            gh release create "$GITHUB_REF_NAME" FolderPlayerFork-*.apk SHA256SUMS.txt ffmpeg-7.1.5.tar.xz \
              --title "Folder Player Fork $VERSION" --notes-file notes.md
          fi
